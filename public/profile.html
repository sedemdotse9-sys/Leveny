<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Leveny</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card-wrapper {
    position: relative;
    width: 380px;
    border-radius: 26px;
    padding: 1.5px;
    background: var(--card-border-grad);
    box-shadow: var(--card-shadow);
    margin-top: 40px;
  }

  .login-card {
    position: relative;
    border-radius: 24.5px;
    padding: 56px 36px 32px;
    overflow: visible;
  }

  .avatar-circle {
    position: absolute;
    top: -38px;
    left: 50%;
    transform: translateX(-50%);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--avatar-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid var(--avatar-border);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
  }

  .avatar-circle svg {
    width: 40px;
    height: 40px;
    fill: var(--avatar-icon);
  }

  h1 {
    text-align: center;
    margin: 6px 0 4px;
    font-size: 21px;
    font-weight: 600;
  }

  p.subtitle {
    text-align: center;
    margin: 0 0 28px;
    font-size: 13.5px;
    color: var(--text-secondary);
  }

  .strength-wrap {
    display: none;
    margin-top: 8px;
    align-items: center;
    gap: 8px;
  }

  .strength-wrap.show { display: flex; }

  .strength-track {
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: var(--input-border);
    overflow: hidden;
  }

  .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    transition: width 0.2s ease, background 0.2s ease;
  }

  .strength-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    min-width: 48px;
    text-align: right;
  }

  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 0 22px;
    font-size: 12.5px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
  }

  .remember input {
    width: 14px;
    height: 14px;
    accent-color: var(--accent-b);
    cursor: pointer;
  }

  .forgot-link {
    color: var(--link-color);
    text-decoration: none;
    font-weight: 500;
  }

  .forgot-link:hover { text-decoration: underline; }

  .switch-mode {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .switch-mode button {
    background: none;
    border: none;
    color: var(--link-color);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }

  .switch-mode button:hover { text-decoration: underline; }

  .hidden { display: none; }
</style>
</head>
<body>

  <button class="theme-toggle" type="button">
    <span data-theme-icon></span>
  </button>

  <div class="card-wrapper">
    <form class="login-card glass" id="authForm" novalidate autocomplete="off">
      <div class="avatar-circle">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/>
        </svg>
      </div>

      <h1 id="formTitle">Welcome back</h1>
      <p class="subtitle" id="formSubtitle">Sign in to continue</p>

      <div class="field hidden" id="usernameField">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" class="with-icon" placeholder="e.g. jane_doe" autocomplete="username">
          <svg class="status-icon valid" id="usernameValidIcon" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          <svg class="status-icon invalid" id="usernameInvalidIcon" viewBox="0 0 24 24"><path d="M12 10.6 6.7 5.3 5.3 6.7 10.6 12l-5.3 5.3 1.4 1.4L12 13.4l5.3 5.3 1.4-1.4L13.4 12l5.3-5.3-1.4-1.4z"/></svg>
        </div>
        <p class="hint">3-20 characters: letters, numbers, underscore, or dot.</p>
      </div>

      <div class="field" id="identifierField">
        <label for="identifier" id="identifierLabel">Username or email</label>
        <div class="input-wrapper">
          <input type="text" id="identifier" name="identifier" class="with-icon" placeholder="you@gmail.com or username" autocomplete="username">
          <svg class="status-icon valid" id="identifierValidIcon" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          <svg class="status-icon invalid" id="identifierInvalidIcon" viewBox="0 0 24 24"><path d="M12 10.6 6.7 5.3 5.3 6.7 10.6 12l-5.3 5.3 1.4 1.4L12 13.4l5.3 5.3 1.4-1.4L13.4 12l5.3-5.3-1.4-1.4z"/></svg>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" class="with-icon" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="eye-btn" id="togglePassword" aria-label="Show password" tabindex="-1">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-7.2A2.7 2.7 0 1 0 12 14a2.7 2.7 0 0 0 0-4.7z"/></svg>
          </button>
        </div>
        <div class="strength-wrap" id="strengthWrap">
          <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
      </div>

      <div class="field hidden" id="confirmField">
        <label for="confirmPassword">Confirm password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" name="confirmPassword" class="with-icon" placeholder="Re-enter your password" autocomplete="new-password">
          <svg class="status-icon valid" id="confirmValidIcon" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          <svg class="status-icon invalid" id="confirmInvalidIcon" viewBox="0 0 24 24"><path d="M12 10.6 6.7 5.3 5.3 6.7 10.6 12l-5.3 5.3 1.4 1.4L12 13.4l5.3 5.3 1.4-1.4L13.4 12l5.3-5.3-1.4-1.4z"/></svg>
        </div>
      </div>

      <div class="row-between" id="rememberRow">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>
        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="primary-btn" id="submitBtn">Sign In</button>
      <p id="errorMsg" class="error"></p>

      <p class="switch-mode">
        <span id="switchText">New here?</span>
        <button type="button" id="switchBtn">Create account</button>
      </p>
    </form>
  </div>

<script src="assets/theme.js"></script>
<script>
  const form = document.getElementById('authForm');
  const usernameField = document.getElementById('usernameField');
  const usernameInput = document.getElementById('username');
  const identifierField = document.getElementById('identifierField');
  const identifierInput = document.getElementById('identifier');
  const identifierLabel = document.getElementById('identifierLabel');
  const passwordInput = document.getElementById('password');
  const confirmField = document.getElementById('confirmField');
  const confirmInput = document.getElementById('confirmPassword');
  const errorMsg = document.getElementById('errorMsg');
  const formTitle = document.getElementById('formTitle');
  const formSubtitle = document.getElementById('formSubtitle');
  const submitBtn = document.getElementById('submitBtn');
  const switchBtn = document.getElementById('switchBtn');
  const switchText = document.getElementById('switchText');
  const forgotLink = document.getElementById('forgotLink');
  const rememberRow = document.getElementById('rememberRow');

  const usernameValidIcon = document.getElementById('usernameValidIcon');
  const usernameInvalidIcon = document.getElementById('usernameInvalidIcon');
  const identifierValidIcon = document.getElementById('identifierValidIcon');
  const identifierInvalidIcon = document.getElementById('identifierInvalidIcon');
  const confirmValidIcon = document.getElementById('confirmValidIcon');
  const confirmInvalidIcon = document.getElementById('confirmInvalidIcon');

  const togglePasswordBtn = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');

  const strengthWrap = document.getElementById('strengthWrap');
  const strengthFill = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');

  let mode = 'login';

  const usernameRegex = /^[a-zA-Z0-9_.]{3,20}$/;
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const eyeOpenPath = 'M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-7.2A2.7 2.7 0 1 0 12 14a2.7 2.7 0 0 0 0-4.7z';
  const eyeClosedPath = 'M3.3 2.3 2 3.6l3.4 3.4C3.6 8.4 2.2 10 1 12c0 0 3 7 11 7 2 0 3.7-.4 5.1-1.1l3.6 3.5 1.3-1.3zM12 16.5c-.6 0-1.1-.1-1.6-.3l-6-6a11 11 0 0 1 2-2.6l1.6 1.6a4.5 4.5 0 0 0 6.3 6.3l1 1c-1 .3-2.1.5-3.3.5zm.4-9.9L14.9 9c.1.3.1.6.1 1a2.7 2.7 0 0 1-2.7 2.7c-.3 0-.6 0-.9-.1l-2.5-2.5A4.5 4.5 0 0 1 12 7.5c.1 0 .3 0 .4.1zM21 12s-1 2.4-3.1 4.2l-1.4-1.4c1.1-1 1.9-2.1 2.3-2.8-.6-1-2.9-4.5-8.1-4.9L9 5.4c1-.3 2-.4 3-.4 8 0 11 7 11 7z';

  function setEyeIcon(open) {
    eyeIcon.innerHTML = '<path d="' + (open ? eyeClosedPath : eyeOpenPath) + '"/>';
  }
  setEyeIcon(false);

  togglePasswordBtn.addEventListener('click', function () {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    setEyeIcon(isPassword);
    togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });

  usernameInput.addEventListener('input', function () {
    const val = usernameInput.value.trim();
    if (val === '') {
      usernameValidIcon.classList.remove('show');
      usernameInvalidIcon.classList.remove('show');
      return;
    }
    const ok = usernameRegex.test(val);
    usernameValidIcon.classList.toggle('show', ok);
    usernameInvalidIcon.classList.toggle('show', !ok);
  });

  identifierInput.addEventListener('input', function () {
    if (mode !== 'signup') return; // in signup this field is "email"
    const val = identifierInput.value.trim();
    if (val === '') {
      identifierValidIcon.classList.remove('show');
      identifierInvalidIcon.classList.remove('show');
      return;
    }
    const ok = emailRegex.test(val);
    identifierValidIcon.classList.toggle('show', ok);
    identifierInvalidIcon.classList.toggle('show', !ok);
  });

  function getStrength(pw) {
    let score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/\d/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    return score;
  }

  const strengthLevels = [
    { min: 0, label: '', color: '', width: '0%' },
    { min: 1, label: 'Weak', color: '#f87171', width: '25%' },
    { min: 3, label: 'Fair', color: '#fbbf24', width: '55%' },
    { min: 4, label: 'Strong', color: '#4ade80', width: '80%' },
    { min: 5, label: 'Excellent', color: '#22d3ee', width: '100%' }
  ];

  passwordInput.addEventListener('input', function () {
    if (mode !== 'signup') return;
    const pw = passwordInput.value;
    if (pw === '') {
      strengthWrap.classList.remove('show');
      return;
    }
    strengthWrap.classList.add('show');
    const score = getStrength(pw);
    let level = strengthLevels[0];
    for (const l of strengthLevels) if (score >= l.min) level = l;
    strengthFill.style.width = level.width;
    strengthFill.style.background = level.color;
    strengthLabel.textContent = level.label;
  });

  confirmInput.addEventListener('input', function () {
    const val = confirmInput.value;
    if (val === '') {
      confirmValidIcon.classList.remove('show');
      confirmInvalidIcon.classList.remove('show');
      return;
    }
    const matches = val === passwordInput.value;
    confirmValidIcon.classList.toggle('show', matches);
    confirmInvalidIcon.classList.toggle('show', !matches);
  });

  function resetFieldStates() {
    errorMsg.textContent = '';
    errorMsg.classList.remove('success');
    [usernameValidIcon, usernameInvalidIcon, identifierValidIcon, identifierInvalidIcon,
     confirmValidIcon, confirmInvalidIcon].forEach((el) => el.classList.remove('show'));
    strengthWrap.classList.remove('show');
  }

  function clearFormFields() {
    usernameInput.value = '';
    identifierInput.value = '';
    passwordInput.value = '';
    confirmInput.value = '';
    passwordInput.setAttribute('type', 'password');
    setEyeIcon(false);
  }

  switchBtn.addEventListener('click', function () {
    mode = mode === 'login' ? 'signup' : 'login';
    resetFieldStates();
    clearFormFields();

    if (mode === 'signup') {
      formTitle.textContent = 'Create your account';
      formSubtitle.textContent = 'Sign up to get started';
      submitBtn.textContent = 'Sign Up';
      usernameField.classList.remove('hidden');
      confirmField.classList.remove('hidden');
      rememberRow.classList.add('hidden');
      identifierLabel.textContent = 'Email';
      identifierInput.placeholder = 'you@gmail.com';
      identifierInput.type = 'email';
      switchText.textContent = 'Already have an account?';
      switchBtn.textContent = 'Sign in';
    } else {
      formTitle.textContent = 'Welcome back';
      formSubtitle.textContent = 'Sign in to continue';
      submitBtn.textContent = 'Sign In';
      usernameField.classList.add('hidden');
      confirmField.classList.add('hidden');
      rememberRow.classList.remove('hidden');
      identifierLabel.textContent = 'Username or email';
      identifierInput.placeholder = 'you@gmail.com or username';
      identifierInput.type = 'text';
      switchText.textContent = 'New here?';
      switchBtn.textContent = 'Create account';
    }
  });

  forgotLink.addEventListener('click', function (e) {
    e.preventDefault();
    errorMsg.classList.remove('success');
    errorMsg.textContent = 'Password reset isn\u2019t wired up yet \u2014 use Password & Security after logging in.';
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorMsg.textContent = '';
    errorMsg.classList.remove('success');

    const identifier = identifierInput.value.trim();
    const password = passwordInput.value;

    if (mode === 'signup') {
      const username = usernameInput.value.trim();
      const confirm = confirmInput.value;

      if (!username || !identifier || !password) {
        errorMsg.textContent = 'Please fill in all fields.';
        return;
      }
      if (!usernameRegex.test(username)) {
        errorMsg.textContent = 'Username must be 3-20 characters (letters, numbers, underscore, dot).';
        return;
      }
      if (!emailRegex.test(identifier)) {
        errorMsg.textContent = 'Please enter a valid email address.';
        return;
      }
      if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (confirm !== password) {
        errorMsg.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email: identifier, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.textContent = data.error || 'Something went wrong.';
          submitBtn.disabled = false;
          return;
        }
        sessionStorage.setItem('leveny-user', data.user.username);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorMsg.textContent = 'Could not reach the server. Is it running?';
        submitBtn.disabled = false;
      }
      return;
    }

    // login mode
    if (!identifier || !password) {
      errorMsg.textContent = 'Please fill in all fields.';
      return;
    }

    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, password })
      });
      const data = await res.json();
      if (!res.ok) {
        errorMsg.textContent = data.error || 'Something went wrong.';
        submitBtn.disabled = false;
        return;
      }
      sessionStorage.setItem('leveny-user', data.user.username);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorMsg.textContent = 'Could not reach the server. Is it running?';
      submitBtn.disabled = false;
    }
  });

  // if already logged in this tab, skip straight to dashboard
  if (sessionStorage.getItem('leveny-user')) {
    window.location.href = 'dashboard.html';
  }

  // Always start blank — clears anything the browser tried to restore
  // (autofill, or a cached form state from hitting the back button).
  window.addEventListener('pageshow', function () {
    clearFormFields();
    resetFieldStates();
  });
</script>

</body>
</html>

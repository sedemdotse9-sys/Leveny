<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/discover.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <title>Discover | Leveny</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
</head>
<body class="discover-body" data-theme="1">
    <header>
        <nav class="nav_bar">
            <h2 class="logo">Leveny</h2>
            <ul class="nav_links">
                <a href="index.html"><i class="fas fa-home"></i>Home</a>
                <a href="Genres.html"><i class="fa-solid fa-compact-disc"></i>Genres</a>
                <a href="Profile.html"><i class="fa-regular fa-user"></i>Profile</a>
                <a href="Movie_Request.html"><i class="fas fa-envelope"></i>Request</a>
            </ul>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search movies...">
                <button><i class="fas fa-search"></i></button>
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
        </nav>
        <hr>
    </header>

    <!-- Theme (color) navigation arrows -->
    <div class="discover-arrow-left" id="discoverPrevTheme">&lt;</div>
    <div class="discover-arrow-right" id="discoverNextTheme">&gt;</div>

    <div class="discover-wrapper">
        <h1 class="page-title">DISCOVER MOVIES</h1>

        <div class="movies-grid" id="moviesGrid">
            <!-- Movies loaded by JavaScript -->
        </div>

        <div class="pagination-container">
            <button class="pagination-btn" id="prevBtn" disabled>
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="page-numbers" id="pageNumbers">
                <!-- Page numbers generated by JavaScript -->
            </div>

            <button class="pagination-btn" id="nextBtn">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <footer class="copyright">
        <a href="../disclaimer.html">Disclaimer!</a>
    </footer>

    <script src="js/movies.js"></script>
    <script src="js/discover.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
